name: build

on:
  push:
    # A change to the docs alone builds nothing.
    paths-ignore: ['docs/**', '**.md']
  pull_request:
  workflow_dispatch:
    inputs:
      experimental_ref:
        description: >-
          Publish the public Experimental build from this commit (a tested one). Empty: an
          ordinary build, its APK only for the owner.
        required: false
        default: ''

# A newer push to the same branch cancels the older build still running.
concurrency:
  group: build-${{ github.ref }}-${{ inputs.experimental_ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the VR core
        run: |
          cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Release
          cmake --build build/core -j
          ctest --test-dir build/core --output-on-failure

  game-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the Experimental build's release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # decomp/: the C sources of the game (no game data)
          ref: ${{ inputs.experimental_ref || github.sha }}
      - name: Install the guest toolchain (clang, wasm-ld, wasm2c)
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
          # wasm2c pinned: guest/postprocess.py edits the prelude of this version's output (the
          # runner's own wabt moved to 1.0.36, whose prelude differs).
          curl -fsSL https://github.com/WebAssembly/wabt/releases/download/1.0.34/wabt-1.0.34-ubuntu.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wabt-1.0.34/bin" >> "$GITHUB_PATH"
          clang --version | head -1
          "$RUNNER_TEMP/wabt-1.0.34/bin/wasm2c" --version
      - name: Build the game as the guest module
        run: python3 guest/build_guest.py --jobs 4
      - name: Guest data laid out as on the DS
        # Code reads past one data symbol into the next; the port must keep DS neighbours together.
        run: |
          python3 guest/check_data_layout.py | tee layout.txt | tail -5
          bad=$(tail -1 layout.txt | cut -d' ' -f1)
          test "$bad" -le 30
      - name: Platform tests on the desktop
        run: |
          cmake -S platform -B build/platform -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build/platform -j4
          cd build/platform
          ./khdays_run --render-test
          ./khdays_run --pxi-test
          ./khdays_run --sound-test
          ./khdays_run --seq-test
          ./khdays_run --stream-test
          ./khdays_run --gx-test
          ./khdays_run --world-test
          # Boot a minimal fake ROM: OS, threads, interrupts, ARM7 handshakes, file system and
          # overlays must come up and reach the title scene (ov000), which then stops on purpose
          # (OS_Terminate) because the fake ROM has no font. A trap would be a platform bug.
          ./khdays_run --fake-rom --frames 120 --log boot.log | tee run.txt
          grep -q "overlay: start ov000" boot.log
          grep -q "printf self-test ok" boot.log
          ! grep -q "^trap:" boot.log
          # "Return to title" resets the DS: the guest must boot a second time from scratch.
          ./khdays_run --fake-rom --frames 120 --restart --log restart.log > /dev/null
          test "$(grep -c 'overlay: start ov000' restart.log)" -eq 2
          ! grep -q "^trap:" restart.log
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the Quest APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      # In the private test repository a build's APK and symbols are plain downloads. In the public
      # release repository a development build is for the owner only, its APK and symbols in
      # archives locked with the APK_PASSWORD secret (7-Zip, AES-256, names hidden too), nothing
      # without the secret; everyone else gets the Experimental build below.
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private && inputs.experimental_ref == ''
        with:
          name: khdays-vr-apk
          path: android/app/build/outputs/apk/release/*.apk
          # The account's artifact storage is small: a few days is enough to install a build.
          retention-days: 4
      - name: Keep the unstripped library for tools/symbolize.py
        if: github.event.repository.private && inputs.experimental_ref == ''
        run: |
          mkdir -p symbols
          xz -T0 -c android/app/build/intermediates/cxx/*/*/obj/arm64-v8a/libkhdaysvr.so > symbols/libkhdaysvr.so.xz
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private && inputs.experimental_ref == ''
        with:
          name: khdays-vr-symbols
          path: symbols/libkhdaysvr.so.xz
          compression-level: 0
          retention-days: 2
      - name: Lock the development build for the owner
        if: ${{ !github.event.repository.private && inputs.experimental_ref == '' }}
        env:
          APK_PASSWORD: ${{ secrets.APK_PASSWORD }}
        run: |
          if [ -z "$APK_PASSWORD" ]; then
            echo "::notice::No APK_PASSWORD secret: the development APK is not uploaded."
            exit 0
          fi
          mkdir -p locked
          7z a -p"$APK_PASSWORD" -mhe=on locked/khdays-vr-dev.7z ./android/app/build/outputs/apk/release/*.apk > /dev/null
          7z a -p"$APK_PASSWORD" -mhe=on locked/khdays-vr-symbols.7z ./android/app/build/intermediates/cxx/*/*/obj/arm64-v8a/libkhdaysvr.so > /dev/null
      - uses: actions/upload-artifact@v4
        if: ${{ !github.event.repository.private && inputs.experimental_ref == '' }}
        with:
          name: khdays-vr-dev-locked
          path: locked/khdays-vr-dev.7z
          if-no-files-found: ignore
          # Artifacts count against the account's storage: a week is enough to install a build.
          retention-days: 7
      - name: Keep the unstripped library for tools/symbolize.py (locked)
        if: ${{ !github.event.repository.private && inputs.experimental_ref == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: khdays-vr-symbols-locked
          path: locked/khdays-vr-symbols.7z
          if-no-files-found: ignore
          retention-days: 2
      # The public Experimental build: one tested commit, as a pre-release under the fixed tag
      # "experimental" (replaced each time, so the README's link stays the same).
      - name: Publish the Experimental build
        if: inputs.experimental_ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.experimental_ref }}
        run: |
          sha=$(git rev-parse HEAD)
          day=$(TZ=America/New_York date '+%B %-d, %Y')
          cp android/app/build/outputs/apk/release/*.apk KH-Days-VR-experimental.apk
          gh release delete experimental --cleanup-tag --yes || true
          gh release create experimental KH-Days-VR-experimental.apk --prerelease --target "$sha" \
            --title "Experimental build ($day)" \
            --notes "Experimental build of KH 358/2 Days VR from commit ${sha:0:7}, built $day. Expect bugs: newer work is still being tested. You need your own dump of the European cartridge (YKGP); see the README for installing."
