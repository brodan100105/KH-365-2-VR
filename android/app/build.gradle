plugins {
    id 'com.android.application'
}

android {
    namespace 'com.khdays.vr'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.khdays.vr'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'   // Quest headsets are 64-bit ARM only
        }
        externalNativeBuild {
            cmake {
                // The OpenXR loader prefab is built against the shared C++ runtime.
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildFeatures {
        prefab true
    }

    lint {
        // Quest apps target API 32 as Meta's Horizon OS guidance says; the Play Store's
        // newer-target rule does not apply to a sideloaded headset app.
        disable 'ExpiredTargetSdkVersion'
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        // One fixed key for every build, so a new APK installs over the old one and keeps its
        // settings and permissions. It only identifies sideloaded builds: not a secret.
        sideload {
            storeFile file('../keystore/sideload.jks')
            storePassword 'khdaysvr'
            keyAlias 'sideload'
            keyPassword 'khdaysvr'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.49'
}
